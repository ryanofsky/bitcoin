name: afunix-probe-o55

# Throwaway workflow: how std::filesystem and Win32 APIs see a stale AF_UNIX
# socket file on Windows, per toolchain and runner image. Probe source:
# contrib/afunix-probe-o55/probe.cpp. Each run prints markdown tables and
# uploads them as artifacts.

on:
  push:
  workflow_dispatch:

jobs:
  msvc:
    name: 'MSVC, ${{ matrix.os }}'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025, windows-2025-vs2026]
    steps:
      - uses: actions/checkout@v6
      - name: Import Visual Studio env vars
        run: py -3 .github/ci-windows.py "standard" github_import_vs_env
      - name: Environment
        shell: pwsh
        run: |
          [System.Environment]::OSVersion.VersionString
          cmd /c ver
          "VCToolsVersion=$env:VCToolsVersion"
      - name: Build
        shell: cmd
        run: |
          cl /nologo /std:c++20 /EHsc /W3 /O2 /MT /Fe:probe-msvc.exe contrib\afunix-probe-o55\probe.cpp ws2_32.lib advapi32.lib version.lib || exit /b 1
          cl /nologo /std:c++20 /EHsc /W3 /O2 /MD /Fe:probe-msvc-md.exe contrib\afunix-probe-o55\probe.cpp ws2_32.lib advapi32.lib version.lib || exit /b 1
      - name: Probe
        shell: pwsh
        run: |
          .\probe-msvc.exe "MSVC /MT (static CRT) $env:VCToolsVersion on ${{ matrix.os }}" | Tee-Object -FilePath results-msvc-${{ matrix.os }}.md
          .\probe-msvc-md.exe "MSVC /MD (ucrtbase.dll) $env:VCToolsVersion on ${{ matrix.os }}" | Tee-Object -FilePath results-msvcmd-${{ matrix.os }}.md
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: results-msvc-${{ matrix.os }}
          path: results-*.md

  msys2:
    name: 'MSYS2 UCRT64, ${{ matrix.os }}'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    steps:
      - uses: actions/checkout@v6
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Build
        shell: msys2 {0}
        run: |
          g++ --version | head -1
          g++ -std=c++20 -O2 -Wall -static -o probe-msys2.exe contrib/afunix-probe-o55/probe.cpp -lws2_32 -lversion
      - name: Probe
        shell: pwsh
        run: .\probe-msys2.exe "MSYS2 UCRT64 g++ on ${{ matrix.os }}" | Tee-Object -FilePath results-msys2-${{ matrix.os }}.md
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: results-msys2-${{ matrix.os }}
          path: results-*.md

  run-nix:
    # probe-nix-ucrt.exe is cross-compiled locally with the exact Bitcoin Core
    # cross toolchain (contrib/devtools/shell-win64-cross.nix: GCC 14.3.0 ucrt64,
    # posix threads, mingw-w64 13.0.0), checked in under prebuilt/ because
    # building that GCC in CI takes too long.
    name: 'nix cross g++ (prebuilt), ${{ matrix.os }}'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    steps:
      - uses: actions/checkout@v6
      - name: Probe
        shell: pwsh
        run: .\contrib\afunix-probe-o55\prebuilt\probe-nix-ucrt.exe "bitcoin nix shell-win64-cross g++ 14.3.0 on ${{ matrix.os }}" | Tee-Object -FilePath results-nix-${{ matrix.os }}.md
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: results-nix-${{ matrix.os }}
          path: results-*.md
